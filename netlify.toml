[images]
  remote_images = [".*"]

[build]
publish = ".output/public"
command = "pnpm run generate"

[build.environment]
# Nuxt 4 requires Node 22.22+/24.15+. Older Netlify sites stay pinned to
# Node 18, which crashes before .output/public is generated.
NODE_VERSION = "24"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/_nuxt/*"
[headers.values]
cache-control = '''
max-age=31536000,
immutable
'''
